spring.application.name=busgo
# Hosting platforms (Render, Railway, ...) tell the app which port to use through the PORT variable.
server.port=${PORT:8080}
# Behind a hosting proxy set FORWARD_HEADERS_STRATEGY=native so the real client address is used (needed for the login rate limit).
# Leave it as 'none' when nothing sits in front of the app: otherwise a client could fake its address.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Optional git-ignored file next to the backend that holds your real DB password / JWT secret.
spring.config.import=optional:file:./application-local.properties

# --- Database (MySQL). Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/busgo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:busgo_user}
spring.datasource.password=${DB_PASSWORD:}

# Flyway creates/updates tables from src/main/resources/db/migration.
# Hibernate only VALIDATES that entities match the tables - it never drops or recreates anything.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# We issue our own JWTs, so Spring Boot's auto-generated default user is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- App settings ---
# JWT_SECRET (>= 32 chars) must be supplied by env var or application-local.properties.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=1440
# Origins allowed to call the API from a browser (Flutter web during development).
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
# Create demo operators/trips for the next 14 days at startup (only adds what is missing).
app.demo.seed-on-startup=true
# POST /api/demo/reset wipes bookings and regenerates demo trips. Keep false outside development.
app.demo.reset-enabled=false
# Max login/register/reset-password POSTs per client address per minute (brute-force protection).
app.rate-limit.auth-per-minute=10

# --- Trip providers (see docs/ARCHITECTURE.md) ---
# The demo provider serves sample trips stored in this database. Only add real providers with an official agreement.
app.providers.demo.enabled=true
# A provider that does not answer in this time is skipped; the others still return their results.
app.providers.timeout-ms=5000
# Also create demo routes for every state/union territory (from data/demo-routes.csv), not just the hand-picked ones.
app.demo.include-generated-routes=true

# --- Google sign-in (optional) ---
# Comma-separated OAuth *Web* client id(s) from Google Cloud Console. Empty = Google sign-in disabled.
# Set it through the GOOGLE_CLIENT_IDS environment variable. A client id is public; never put a client secret here.
app.google.client-ids=${GOOGLE_CLIENT_IDS:}

# --- Email (see docs/EMAIL_SETUP.md) ---
# false = nothing is sent (a log line only). true = real emails over SMTP using the settings below.
app.mail.enabled=${MAIL_ENABLED:false}
# smtp = normal SMTP (spring.mail.* below). brevo = HTTPS API; use it on hosts that block SMTP ports (Render free plan).
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.brevo.api-key=${BREVO_API_KEY:}
# "BusGo <no-reply@example.com>". If empty, the SMTP login (MAIL_USERNAME) is used as the sender.
app.mail.from=${MAIL_FROM:}
# DEVELOPMENT ONLY: also log message bodies (they contain reset codes). Keep false whenever real users exist.
app.mail.log-bodies=false
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# --- Forgot password ---
app.password-reset.expiry-minutes=15
# Wrong guesses allowed per code before it is useless.
app.password-reset.max-attempts=5
# Asking for another code sooner than this after the last one is ignored (stops email flooding).
app.password-reset.resend-seconds=60