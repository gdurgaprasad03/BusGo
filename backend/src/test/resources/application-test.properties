# Tests use an in-memory H2 database in MySQL-compatibility mode. Flyway builds the same schema as production.
spring.datasource.url=jdbc:h2:mem:busgo_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Ignore the developer's real application-local.properties during tests.
spring.config.import=optional:file:./no-such-file-for-tests.properties
app.jwt.secret=test-only-secret-that-is-at-least-32-characters-long
app.demo.seed-on-startup=false
# Tests only search "tomorrow", so generating 3 days keeps every reset fast.
app.google.client-ids=test-web-client.apps.googleusercontent.com
app.demo.days-ahead=3
# Only the hand-picked routes in tests; the generated all-India routes would make every reset slow.
app.demo.include-generated-routes=false
app.demo.reset-enabled=true
# High limit so ordinary tests are never throttled; RateLimitTest lowers it.
app.rate-limit.auth-per-minute=1000

# Emails go to GreenMail, a real SMTP server started inside the tests (port is set in IntegrationTestBase).
app.mail.enabled=true
app.mail.from=BusGo Test <no-reply@busgo.test>
spring.mail.host=127.0.0.1
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.password-reset.resend-seconds=0